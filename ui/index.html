<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Engine Core - Generative 3D Workspace</title>
    <style>
        body { margin: 0; background: #090d16; color: #f8fafc; font-family: sans-serif; overflow: hidden; }
        #hud { position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.92); padding: 15px; border-radius: 8px; border: 1px solid #334155; width: 360px; pointer-events: auto; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        h3 { margin: 0 0 10px 0; font-size: 16px; color: #38bdf8; }
        pre { background: #020617; padding: 10px; border-radius: 4px; font-size: 11px; overflow-x: auto; color: #4ade80; max-height: 140px; }
        input[type="text"] { width: 100%; box-sizing: border-box; background: #020617; border: 1px solid #334155; color: #f8fafc; padding: 8px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; }
        button { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 5px; width: 100%; font-weight: bold; }
        button:hover { background: #0ea5e9; }
        #canvas-container { width: 100vw; height: 100vh; }
        .status-row { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud">
        <h3>Spatial Engine 4D Telemetry</h3>
        <div class="status-row">Backend: <span id="status" style="color: #4ade80;">Connected (Authoritative)</span></div>
        
        <!-- LLM Prompt Input Console -->
        <div style="margin-bottom: 8px;">
            <label style="font-size: 11px; color: #38bdf8; font-weight: bold;">GENERATIVE PROMPT INGESTION</label>
            <input type="text" id="prompt-input" placeholder="e.g. A glowing obsidian monolith..." value="A mystical floating crystal shrine">
            <button id="prompt-btn">Generate & Spawn from Prompt</button>
        </div>

        <pre id="json-stream">Initializing telemetry feed...</pre>
        <button id="toggle-time">Switch to 4D Night Mode (Lit)</button>
    </div>
    <div id="canvas-container"></div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090d16);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const grid = new THREE.GridHelper(20, 20, 0x38bdf8, 0x1e293b);
        grid.position.y = -1;
        scene.add(grid);

        const activeMeshes = new Map();

        function createMeshForCategory(category) {
            let geometry, material;
            if (category === "Shrine" || category === "Monolith") {
                geometry = new THREE.BoxGeometry(1.2, 2.2, 1.2);
                material = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.2 });
            } else if (category === "Lantern") {
                geometry = new THREE.CylinderGeometry(0.5, 0.5, 1.4, 16);
                material = new THREE.MeshStandardMaterial({ color: 0xd9381e, roughness: 0.3 });
            } else {
                geometry = new THREE.ConeGeometry(1.0, 1.8, 4);
                material = new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.4 });
            }
            return new THREE.Mesh(geometry, material);
        }

        async function syncSceneGraph() {
            try {
                const res = await fetch('http://127.0.0.1:3000/api/scene');
                const nodes = await res.json();
                
                document.getElementById('status').innerText = "Connected (Authoritative Server)";
                document.getElementById('status').style.color = "#4ade80";
                document.getElementById('json-stream').innerText = JSON.stringify(nodes, null, 2);

                nodes.forEach(node => {
                    if (!activeMeshes.has(node.object_id)) {
                        const mesh = createMeshForCategory(node.object_category);
                        mesh.position.set(node.position.x, node.position.y, node.position.z);
                        mesh.scale.set(node.scale.x, node.scale.y, node.scale.z);
                        scene.add(mesh);
                        activeMeshes.set(node.object_id, mesh);
                    }
                });
            } catch (err) {
                document.getElementById('status').innerText = "Offline (Start Rust Server)";
                document.getElementById('status').style.color = "#f87171";
            }
        }

        setInterval(syncSceneGraph, 1500);
        syncSceneGraph();

        document.getElementById('prompt-btn').addEventListener('click', async () => {
            const promptText = document.getElementById('prompt-input').value;
            const count = activeMeshes.size + 1;
            let category = "Shrine";
            if (promptText.toLowerCase().includes("lantern")) category = "Lantern";
            if (promptText.toLowerCase().includes("tower") || promptText.toLowerCase().includes("pagoda")) category = "Pagoda";

            const newNode = {
                object_id: `${category.toLowerCase()}_00${count}`,
                object_category: category,
                object_caption: promptText,
                supported_by: "FLOOR",
                position: { x: (Math.random() - 0.5) * 8, y: 0, z: (Math.random() - 0.5) * 8 },
                scale: { x: 1.0, y: 1.0, z: 1.0 },
                orientation: { x: 0.0, y: 0.0, z: 0.0 },
                lighting_state: "Day",
                timestamp: Date.now(),
                client_id: "termux_web_client"
            };

            await fetch('http://127.0.0.1:3000/api/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newNode)
            });
            syncSceneGraph();
        });

        let isNight = false;
        document.getElementById('toggle-time').addEventListener('click', () => {
            isNight = !isNight;
            if (isNight) {
                scene.background.set(0x020617);
                ambientLight.intensity = 0.1;
                dirLight.intensity = 0.2;
                activeMeshes.forEach(mesh => {
                    if (mesh.material.emissive) {
                        mesh.material.emissive.set(0xff4422);
                        mesh.material.emissiveIntensity = 0.8;
                    }
                });
                document.getElementById('toggle-time').innerText = "Switch to Day Mode";
            } else {
                scene.background.set(0x090d16);
                ambientLight.intensity = 0.7;
                dirLight.intensity = 1.2;
                activeMeshes.forEach(mesh => {
                    if (mesh.material.emissive) {
                        mesh.material.emissive.set(0x000000);
                    }
                });
                document.getElementById('toggle-time').innerText = "Switch to 4D Night Mode (Lit)";
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            activeMeshes.forEach(mesh => mesh.rotation.y += 0.005);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
