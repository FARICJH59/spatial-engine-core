<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Engine Core - 3D Visualizer</title>
    <style>
        body { margin: 0; background: #0f172a; color: #f8fafc; font-family: sans-serif; overflow: hidden; }
        #hud { position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.85); padding: 15px; border-radius: 8px; border: 1px solid #334155; width: 320px; pointer-events: auto; }
        h3 { margin: 0 0 10px 0; font-size: 16px; color: #38bdf8; }
        pre { background: #020617; padding: 10px; border-radius: 4px; font-size: 11px; overflow-x: auto; color: #4ade80; max-height: 150px; }
        button { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 5px; width: 100%; font-weight: bold; }
        button:hover { background: #0ea5e9; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <!-- Three.js CDN for 3D Viewport Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud">
        <h3>Spatial Engine 4D Telemetry</h3>
        <p style="font-size: 12px; color: #94a3b8;">Active Object: <span id="obj-id">lantern_001</span></p>
        <pre id="json-stream">{
  "object_id": "lantern_001",
  "object_category": "Lantern",
  "position": { "x": 0, "y": 0, "z": 0 },
  "lighting": "Day"
}</pre>
        <button id="toggle-time">Toggle 4D Night Mode</button>
    </div>
    <div id="canvas-container"></div>

    <script>
        // Initialize Three.js Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Add Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Procedural Lantern Placeholder Mesh (representing the AI object)
        const geometry = new THREE.CylinderGeometry(0.6, 0.6, 1.5, 32);
        const material = new THREE.MeshStandardMaterial({ color: 0xd9381e, roughness: 0.3 });
        const lantern = new THREE.Mesh(geometry, material);
        scene.add(lantern);

        // Floor Grid
        const grid = new THREE.GridHelper(20, 20, 0x38bdf8, 0x1e293b);
        grid.position.y = -1;
        scene.add(grid);

        // 4D Toggle Logic (Day/Night & Lantern Emissive Glow)
        let isNight = false;
        document.getElementById('toggle-time').addEventListener('click', () => {
            isNight = !isNight;
            if (isNight) {
                scene.background.set(0x020617);
                ambientLight.intensity = 0.1;
                dirLight.intensity = 0.2;
                material.emissive.set(0xff4422); // Lantern lights up at night[span_4](start_span)[span_4](end_span)[span_5](start_span)[span_5](end_span)
                material.emissiveIntensity = 0.9;
                document.getElementById('toggle-time').innerText = "Switch to Day Mode";
                document.getElementById('json-stream').innerText = JSON.stringify({ object_id: "lantern_001", lighting: "Night (Lit)" }, null, 2);
            } else {
                scene.background.set(0x0f172a);
                ambientLight.intensity = 0.8;
                dirLight.intensity = 1.2;
                material.emissive.set(0x000000); // Lights turn off in the day[span_6](start_span)[span_6](end_span)[span_7](start_span)[span_7](end_span)
                document.getElementById('toggle-time').innerText = "Switch to Night Mode (4D)";
                document.getElementById('json-stream').innerText = JSON.stringify({ object_id: "lantern_001", lighting: "Day" }, null, 2);
            }
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            lantern.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
